name: MCP unit tests
on:
  push:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-tests.yml"
  pull_request:
    paths:
      - "mcp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
