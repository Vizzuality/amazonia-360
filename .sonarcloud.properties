# Lists every top-level entry except the ai-explorations PoC, so a new top-level directory is
# not analysed until it is added here.
sonar.sources=.github,.env.default,.gitignore,.pre-commit-config.yaml,LICENSE,README.md,api,client,database,docker-compose.yml,docs,infrastructure,load_tests,mcp,package.json,pnpm-lock.yaml,science,scripts,splitenv.mjs,tsconfig.json

# Payload writes these files; `payload generate:importmap` and `payload generate:types`
# overwrite any hand edit on the next run. Wildcard patterns are not supported here, so
# each generated file is listed by exact path.
sonar.exclusions=client/src/app/(payload)/admin/importMap.js,client/src/payload-types.ts
