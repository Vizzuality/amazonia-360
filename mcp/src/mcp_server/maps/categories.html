<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Area by category</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <style>/*THEME*/</style>
  <style>/*LEGEND*/</style>
  <style>
    body { display: flex; flex-direction: column; }
    #wrap { position: relative; }
    #map { height: 440px; }
    body.fullscreen { height: 100vh; }
    body.fullscreen #wrap { flex: 1; }
    body.fullscreen #map { height: 100%; }
    body.fullscreen #legend { max-height: 40vh; overflow: auto; }
    #tools { position: absolute; top: 10px; right: 10px; z-index: 2; }
    #tools button {
      font: inherit; font-size: 12px; color: hsl(var(--foreground)); cursor: pointer;
      background: hsl(var(--background)); border: 1px solid var(--color-blue-100);
      border-radius: var(--radius); padding: 4px 10px;
    }
    #tools button:hover { background: hsl(var(--muted)); }
    .row {
      display: flex; align-items: baseline; gap: 6px; width: 100%; padding: 2px 0;
      font: inherit; font-size: 12px; color: inherit; text-align: left;
      background: none; border: 0; cursor: pointer;
    }
    .row:hover .name { text-decoration: underline; }
    .row.hidden { opacity: 0.4; }
    .row .ha { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .total { cursor: default; font-weight: 700; }
    .total:hover .name { text-decoration: none; }
    .maplibregl-popup-content {
      font-family: var(--font-sans); color: hsl(var(--popover-foreground));
      border-radius: var(--radius); padding: 8px 12px; font-size: 12px;
    }
    .maplibregl-popup-content strong { display: block; font-weight: 700; }
  </style>
  <script>/*COMMON*/</script>
</head>
<body>
  <div id="wrap">
    <div id="map"></div>
    <div id="tools"></div>
  </div>
  <div id="legend"></div>
  <script type="module">
    const { translator, esc, number, bounds } = window.map360;
    const t = translator({
      en: {
        waiting: "Waiting for the figures…",
        title: "Hectares by class",
        area: "Area",
        toggle: "Show or hide on the map",
        ha: "{ha} ha",
        popup: "{ha} ha in the area",
        popupShare: "{ha} ha in the area · {share} of the area",
        unclassified: "{ha} ha of the area have no class in this layer. They are not a class of their own.",
        notMapped: "This layer does not map this part of the module.",
        boundingBox: "The module boundary is still a bounding box; part of an area near its edge may fall outside the module.",
        palette: "Some colours are not the layer's own: its style does not give one colour per class.",
        noShapes: "The host did not pass the shapes to the map; the figures above are complete.",
        tooLarge: "The shapes are too large to draw here ({size} MB); the figures above are complete. A smaller area draws.",
        failed: "The map could not load: {message}",
        fullscreen: "Full screen",
        exitFullscreen: "Exit full screen",
      },
      es: {
        waiting: "Esperando las cifras…",
        title: "Hectáreas por clase",
        area: "Área",
        toggle: "Mostrar u ocultar en el mapa",
        ha: "{ha} ha",
        popup: "{ha} ha en el área",
        popupShare: "{ha} ha en el área · {share} del área",
        unclassified: "{ha} ha del área no tienen clase en esta capa. No son una clase propia.",
        notMapped: "Esta capa no cartografía esta parte del módulo.",
        boundingBox: "El límite del módulo es todavía un rectángulo envolvente; parte de un área cerca de su borde puede quedar fuera del módulo.",
        palette: "Algunos colores no son los de la capa: su estilo no da un color por clase.",
        noShapes: "El host no pasó los polígonos al mapa; las cifras de arriba están completas.",
        tooLarge: "Los polígonos son demasiado grandes para dibujarlos aquí ({size} MB); las cifras de arriba están completas. Un área más pequeña sí se dibuja.",
        failed: "No se pudo cargar el mapa: {message}",
        fullscreen: "Pantalla completa",
        exitFullscreen: "Salir de pantalla completa",
      },
    });
    const BASEMAP = "https://tiles.openfreemap.org/styles/positron";
    const AREA = "#009ade"; // The front end's POLYGON_SYMBOL.
    const HOVER = "#009aff"; // The front end's highlight colour.
    const ha = (n) => number(n, { maximumFractionDigits: 0 });
    const pct = (n) => number(n, { style: "percent", maximumFractionDigits: 1 });
    const legend = document.getElementById("legend");
    legend.textContent = t("waiting");

    const library = import("https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs");

    // The area comes with the tool's input; the figures, shapes and colours with its
    // result. Either may arrive first.
    const state = { map: null, result: null, shapes: null, styles: null, omitted: null, hidden: new Set(), error: null };
    let resolveMap;
    const mapReady = new Promise((r) => { resolveMap = r; });

    const byCategory = (key, fallback) => {
      const pairs = Object.entries(state.styles || {}).flatMap(([c, s]) => [c, s[key]]);
      return pairs.length ? ["match", ["get", "category"], ...pairs, fallback] : fallback;
    };

    function applyFilter() {
      const visible = ["!", ["in", ["get", "category"], ["literal", [...state.hidden]]]];
      for (const id of ["shapes-fill", "shapes-line", "shapes-hover"]) state.map.setFilter(id, visible);
    }

    function paintShapes() {
      const { map, shapes, styles } = state;
      if (!map || !shapes || !styles) return;
      map.getSource("shapes").setData(shapes);
      map.setPaintProperty("shapes-fill", "fill-color", byCategory("fill", "#999"));
      map.setPaintProperty("shapes-line", "line-color", byCategory("outline", "rgba(0,0,0,0.25)"));
      map.setPaintProperty("shapes-line", "line-width", byCategory("outline_width", 0.5));
    }

    function renderLegend() {
      if (state.error) {
        legend.innerHTML = `<p class="note">${esc(state.error)}</p>`;
        return;
      }
      const r = state.result;
      if (!r) return;
      const rows = Object.entries(r.value).sort((a, b) => b[1] - a[1]);
      const swatch = (c) => {
        const s = state.styles?.[c];
        return `<span class="swatch" style="background:${esc(s?.swatch || "hsl(var(--muted))")}"></span>`;
      };
      const notes = [];
      if (r.unclassified_ha > 0) notes.push(t("unclassified", { ha: ha(r.unclassified_ha) }));
      if (r.layer?.empty_result === "not_mapped_here") notes.push(t("notMapped"));
      if (r.coverage?.boundary === "bounding_box") notes.push(t("boundingBox"));
      if (state.styles && Object.values(state.styles).some((s) => !s.from_layer)) notes.push(t("palette"));
      if (state.omitted) notes.push(t("tooLarge", { size: number(state.omitted / 1e6, { maximumFractionDigits: 1 }) }));
      else if (!state.shapes) notes.push(t("noShapes"));
      // Written by a person in the CMS, in the language they wrote it in.
      for (const c of r.caveats || []) notes.push(c);
      legend.innerHTML = `
        <h2>${esc(t("title"))}</h2>
        ${rows.map(([c, n]) => `<button class="row${state.hidden.has(c) ? " hidden" : ""}" data-category="${esc(c)}" title="${esc(t("toggle"))}">${swatch(c)}<span class="name">${esc(c)}</span><span class="ha">${esc(t("ha", { ha: ha(n) }))}</span></button>`).join("")}
        <div class="row total"><span class="swatch" style="background:none;box-shadow:inset 0 0 0 1.5px ${AREA}"></span><span class="name">${esc(t("area"))}</span><span class="ha">${esc(t("ha", { ha: ha(r.aoi_ha) }))}</span></div>
        ${notes.map((n) => `<p class="note">${esc(n)}</p>`).join("")}`;
      legend.querySelectorAll("button.row").forEach((row) => row.addEventListener("click", () => {
        const c = row.dataset.category;
        state.hidden.has(c) ? state.hidden.delete(c) : state.hidden.add(c);
        row.classList.toggle("hidden");
        if (state.map) applyFilter();
      }));
    }

    function addFullscreen() {
      const app = window.app;
      const modes = app?.getHostContext?.()?.availableDisplayModes || [];
      if (!modes.includes("fullscreen")) return;
      const button = document.createElement("button");
      const sync = (mode) => {
        document.body.classList.toggle("fullscreen", mode === "fullscreen");
        button.textContent = t(mode === "fullscreen" ? "exitFullscreen" : "fullscreen");
        state.map?.resize();
      };
      button.addEventListener("click", async () => {
        const next = document.body.classList.contains("fullscreen") ? "inline" : "fullscreen";
        const { mode } = await app.requestDisplayMode({ mode: next });
        sync(mode);
      });
      app.onhostcontextchanged = (ctx) => { if (ctx.displayMode) sync(ctx.displayMode); };
      sync(app.getHostContext()?.displayMode || "inline");
      document.getElementById("tools").appendChild(button);
    }

    function addInteraction(maplibregl, map) {
      let hovered = null;
      map.on("mousemove", "shapes-fill", (e) => {
        map.getCanvas().style.cursor = "pointer";
        const id = e.features[0]?.id;
        if (hovered !== null && hovered !== id) map.setFeatureState({ source: "shapes", id: hovered }, { hover: false });
        hovered = id ?? null;
        if (hovered !== null) map.setFeatureState({ source: "shapes", id: hovered }, { hover: true });
      });
      map.on("mouseleave", "shapes-fill", () => {
        map.getCanvas().style.cursor = "";
        if (hovered !== null) map.setFeatureState({ source: "shapes", id: hovered }, { hover: false });
        hovered = null;
      });
      map.on("click", "shapes-fill", (e) => {
        const c = e.features[0]?.properties?.category;
        const r = state.result;
        if (!c) return;
        const n = r?.value?.[c];
        const text = n == null ? "" : r?.aoi_ha
          ? t("popupShare", { ha: ha(n), share: pct(n / r.aoi_ha) })
          : t("popup", { ha: ha(n) });
        new maplibregl.Popup({ closeButton: false, maxWidth: "280px" })
          .setLngLat(e.lngLat)
          .setHTML(`<strong>${esc(c)}</strong>${esc(text)}`)
          .addTo(map);
      });
    }

    async function draw(area) {
      const maplibregl = await library;
      const map = new maplibregl.Map({
        container: "map",
        style: BASEMAP,
        bounds: bounds(area),
        fitBoundsOptions: { padding: 30 },
        attributionControl: { compact: true },
      });
      state.map = map;
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
      map.once("load", () => {
        map.addSource("area", { type: "geojson", data: { type: "Feature", geometry: area, properties: {} } });
        map.addSource("shapes", { type: "geojson", data: { type: "FeatureCollection", features: [] }, generateId: true });
        map.addLayer({ id: "area-fill", type: "fill", source: "area", paint: { "fill-color": AREA, "fill-opacity": 0.13 } });
        map.addLayer({ id: "shapes-fill", type: "fill", source: "shapes", paint: { "fill-color": "#999" } });
        map.addLayer({ id: "shapes-line", type: "line", source: "shapes", paint: {} });
        map.addLayer({
          id: "shapes-hover", type: "line", source: "shapes",
          paint: { "line-color": HOVER, "line-width": ["case", ["boolean", ["feature-state", "hover"], false], 2.5, 0] },
        });
        map.addLayer({ id: "area-line", type: "line", source: "area", paint: { "line-color": AREA, "line-width": 1.5 } });
        addInteraction(maplibregl, map);
        addFullscreen();
        resolveMap();
      });
    }

    // With a place_id the input has no geometry; the result then carries the area.
    let drawn = false;
    function drawOnce(area) {
      if (drawn || !area) return;
      drawn = true;
      draw(area).catch((e) => window.view.fail(String(e?.message || e)));
    }

    window.view = {
      input(args) {
        drawOnce(args.area);
      },
      async result(result) {
        drawOnce(result._meta?.map?.area);
        if (result.isError) {
          state.error = result.content?.[0]?.text || t("failed", { message: "" });
          renderLegend();
          return;
        }
        state.result = result.structuredContent || null;
        state.shapes = result._meta?.map?.shapes || null;
        state.styles = result._meta?.map?.styles || null;
        state.omitted = result._meta?.map?.shapes_omitted_bytes || null;
        renderLegend();
        await mapReady;
        paintShapes();
      },
      fail(message) {
        state.error = t("failed", { message });
        renderLegend();
      },
    };
  </script>
  <script type="module">/*BRIDGE*/</script>
</body>
</html>
