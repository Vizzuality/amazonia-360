<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Raster over the area</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.css">
  <style>/*THEME*/</style>
  <style>/*LEGEND*/</style>
  <style>
    #map { height: 440px; }
  </style>
  <script>/*COMMON*/</script>
</head>
<body>
  <div id="map"></div>
  <div id="legend"></div>
  <script type="module">
    const { translator, esc, number, ha, pct, swatch, ringSwatch, notesHtml, errorMessage, outerRings, createMap, drawOnce } =
      window.map360;
    const t = translator({
      en: {
        title: "{raster}: share of the area",
        unclassified: "Unclassified",
        pixels: "Shares of the {pixels} pixels with data inside the area, about {size} each. Over a small area a share rests on few pixels.",
        unclassifiedNote: "Unclassified pixels have data but fall in no class of the legend. They are not a class of their own.",
        source: "Classes and colours as on Amazonia 360. Outside the area the raster is dimmed; the shares count only the pixels inside.",
        noImage: "The host did not pass the image to the map; the shares above are complete.",
      },
      es: {
        title: "{raster}: proporción del área",
        unclassified: "Sin clase",
        pixels: "Proporción de los {pixels} píxeles con datos dentro del área, de unos {size} cada uno. En un área pequeña, una proporción se apoya en pocos píxeles.",
        unclassifiedNote: "Los píxeles sin clase tienen datos pero no caen en ninguna clase de la leyenda. No son una clase propia.",
        source: "Clases y colores como en Amazonia 360. Fuera del área el ráster se atenúa; las proporciones cuentan solo los píxeles de dentro.",
        noImage: "El host no pasó la imagen al mapa; las proporciones de arriba están completas.",
      },
    });
    // 111.32 km per degree at the equator, which the module sits on.
    const size = (deg) => deg >= 0.009 * 0.9
      ? `${number(deg * 111.32, { maximumFractionDigits: 1 })} km`
      : `${number(Math.round(deg * 111320 / 10) * 10)} m`;
    const legend = document.getElementById("legend");
    legend.textContent = t("waiting");

    const state = { map: null, area: null };
    let resolveMap;
    const mapReady = new Promise((r) => { resolveMap = r; });

    // Everything outside the area, so the raster there is dimmed and not hidden.
    function mask(area) {
      const world = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];
      return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [world, ...outerRings(area).map((r) => [...r].reverse())] } };
    }

    async function draw(area) {
      const { map } = await createMap(area, 60);
      state.map = map;
      state.area = area;
      map.once("load", resolveMap);
    }

    async function addImage({ image, corners }) {
      await mapReady;
      const map = state.map;
      // Above the basemap's fills (its wood and residential areas would hide the raster)
      // and under its lines and names; water is lifted above the raster so rivers show.
      const layers = map.getStyle().layers;
      const under = layers.find((l) => l.type === "line" || l.type === "symbol")?.id;
      map.addSource("raster", { type: "image", url: image, coordinates: corners });
      map.addLayer({ id: "raster", type: "raster", source: "raster", paint: { "raster-resampling": "nearest", "raster-opacity": 0.85 } }, under);
      map.addSource("mask", { type: "geojson", data: mask(state.area) });
      map.addLayer({ id: "mask", type: "fill", source: "mask", paint: { "fill-color": "#ffffff", "fill-opacity": 0.55 } }, under);
      if (layers.some((l) => l.id === "water")) map.moveLayer("water", under);
    }

    const drawArea = drawOnce(draw);

    window.view = {
      input(args) {
        drawArea(args.area);
      },
      result(result) {
        drawArea(result._meta?.map?.area);
        if (result.isError) {
          legend.innerHTML = `<p class="note">${esc(result.content?.[0]?.text || "")}</p>`;
          return;
        }
        const r = result.structuredContent;
        if (!r) return;
        const drawn = result._meta?.map;
        const classes = drawn?.classes || [];
        const colour = Object.fromEntries(classes.map((c) => [c.label, c.color]));
        const order = classes.map((c) => c.label);
        const rows = Object.entries(r.value).sort((a, b) =>
          order.length ? order.indexOf(a[0]) - order.indexOf(b[0]) : b[1] - a[1]);
        if (r.unclassified_share > 0) rows.push([t("unclassified"), r.unclassified_share, true]);
        const over = r.computed_over || {};
        const notes = [];
        if (over.pixels != null) notes.push(t("pixels", {
          pixels: number(over.pixels),
          size: over.pixel_size_deg ? size(over.pixel_size_deg) : "?",
        }));
        if (r.unclassified_share > 0) notes.push(t("unclassifiedNote"));
        if (r.coverage?.outside_ha > 0) notes.push(t("outside", { ha: ha(r.coverage.outside_ha) }));
        // Written by a person in the CMS, in the language they wrote it in.
        for (const c of r.caveats || []) notes.push(c);
        notes.push(t(drawn?.image ? "source" : "noImage"));
        const rowSwatch = (label, none) =>
          none ? ringSwatch("hsl(var(--muted-foreground))", 1) : swatch(colour[label]);
        legend.innerHTML = `
          <h2>${esc(t("title", { raster: drawn?.name || "" }))}</h2>
          ${rows.map(([label, share, none]) => `<div class="row">${rowSwatch(label, none)}<span class="name">${esc(label)}</span><span class="figure">${esc(pct(share))}</span></div>`).join("")}
          ${notesHtml(notes)}`;
        if (drawn?.image) addImage(drawn).catch((e) => window.view.fail(errorMessage(e)));
      },
      fail(message) {
        legend.insertAdjacentHTML("beforeend", `<p class="note">${esc(t("failed", { message }))}</p>`);
      },
    };
  </script>
  <script type="module">/*BRIDGE*/</script>
</body>
</html>
