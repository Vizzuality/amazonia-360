<!doctype html>
<html lang="en" data-library="arcgis">
<head>
  <meta charset="utf-8">
  <title>Area map, ArcGIS</title>
  <script>/*DIAGNOSTICS*/</script>
  <link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/light/main.css">
  <style>
    html, body { margin: 0; font: 13px system-ui, sans-serif; }
    #map { height: 420px; }
    #diag { white-space: pre; padding: 6px 8px; background: #f4f4f4; color: #333; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="diag"></div>
  <script>
    // The bridge may deliver the area before the loader has run.
    const library = new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = "https://js.arcgis.com/4.34/";
      s.onload = () => require(
        ["esri/Map", "esri/views/MapView", "esri/layers/WebTileLayer", "esri/Graphic"],
        (Map, MapView, WebTileLayer, Graphic) => {
          window.diag.mark("library_loaded");
          resolve({ Map, MapView, WebTileLayer, Graphic });
        },
        (e) => { window.diag.mark("library_failed", { message: String(e) }); resolve(null); },
      );
      s.onerror = () => { window.diag.mark("library_failed"); window.diag.done(); resolve(null); };
      document.head.appendChild(s);
    });

    window.drawArea = async (area) => {
      const esri = await library;
      if (!esri) return;
      const rings = area.type === "Polygon" ? area.coordinates : area.coordinates.flat();
      const osm = new esri.WebTileLayer({
        urlTemplate: "https://tile.openstreetmap.org/{level}/{col}/{row}.png",
        copyright: "© OpenStreetMap contributors",
      });
      const graphic = new esri.Graphic({
        geometry: { type: "polygon", rings, spatialReference: { wkid: 4326 } },
        symbol: {
          type: "simple-fill",
          color: [0, 154, 222, 0.15],
          outline: { color: [0, 154, 222], width: 2 },
        },
      });
      const view = new esri.MapView({
        container: "map",
        map: new esri.Map({ layers: [osm] }),
        ui: { components: ["zoom", "attribution"] },
      });
      view.graphics.add(graphic);
      try {
        await view.when();
        window.diag.mark("map_load");
        await view.goTo(graphic.geometry.extent.expand(1.4), { animate: false });
        await new Promise((r) => {
          const h = view.watch("updating", (u) => { if (!u) { h.remove(); r(); } });
          if (!view.updating) { h.remove(); r(); }
        });
        window.diag.mark("map_idle");
      } catch (e) {
        window.diag.mark("map_error", { message: String(e) });
      }
      window.diag.done();
    };
  </script>
  <script type="module">/*BRIDGE*/</script>
</body>
</html>
