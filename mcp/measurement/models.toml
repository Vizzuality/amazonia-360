# Models for amazonia360-mcp-measure.
# Prices in dollars per million tokens, read from the provider's own price page.
# read_on is the date the price was read; source is that page's URL.
# cache_write defaults to input when left out (DeepSeek lists no separate cache write price).
# Write prices as numbers and read_on as a date, without quotes:
#   price = { input = 3.0, cached_input = 0.3, output = 15.0, read_on = 2026-10-20, source = "https://…" }
# A model with any price field, read_on or source empty is refused before any call.
# DeepSeek publishes two models, so it has two entries, not three.
# Gemini prices are the rates after the launch offer: the measurement is for later use.

[[model]]
label = "fable"
provider = "anthropic"
model = "claude-fable-5-1"
price = { input = 10.0, cached_input = 0.25, cache_write = 12.5, output = 50.0, read_on = 2026-10-20, source = "https://platform.claude.com/docs/en/about-claude/pricing" }

[[model]]
label = "opus"
provider = "anthropic"
model = "claude-opus-5-5"
price = { input = 4.0, cached_input = 0.2, cache_write = 5.0, output = 20.0, read_on = 2026-10-20, source = "https://platform.claude.com/docs/en/about-claude/pricing" }

[[model]]
label = "sonnet"
provider = "anthropic"
model = "claude-sonnet-5-5"
price = { input = 2.0, cached_input = 0.1, cache_write = 2.5, output = 10.0, read_on = 2026-10-20, source = "https://platform.claude.com/docs/en/about-claude/pricing" }

# Up to 272K input tokens; above that every rate doubles.
[[model]]
label = "openai-large"
provider = "openai"
model = "gpt-6-astra"
price = { input = 10.0, cached_input = 1.0, cache_write = 12.5, output = 50.0, read_on = 2026-10-20, source = "https://developers.openai.com/api/docs/pricing" }

# Up to 272K input tokens; above that every rate doubles.
[[model]]
label = "openai-mid"
provider = "openai"
model = "gpt-6.1-sol"
price = { input = 2.0, cached_input = 0.1, cache_write = 2.5, output = 10.0, read_on = 2026-10-20, source = "https://developers.openai.com/api/docs/pricing" }

# Up to 272K input tokens; above that every rate doubles.
[[model]]
label = "openai-small"
provider = "openai"
model = "gpt-6-luna"
price = { input = 0.1, cached_input = 0.01, cache_write = 0.125, output = 0.5, read_on = 2026-10-20, source = "https://developers.openai.com/api/docs/pricing" }

# Peak rates, the upper bound; off-peak is half. The page prints no currency symbol.
[[model]]
label = "deepseek-large"
provider = "deepseek"
model = "deepseek-v4-pro"
price = { input = 1.32, cached_input = 0.044, output = 3.96, read_on = 2026-10-20, source = "https://api-docs.deepseek.com/quick_start/pricing" }

# Peak rates, the upper bound; off-peak is half. The page prints no currency symbol.
[[model]]
label = "deepseek-mid"
provider = "deepseek"
model = "deepseek-flash"
price = { input = 0.3, cached_input = 0.006, output = 1.2, read_on = 2026-10-20, source = "https://api-docs.deepseek.com/quick_start/pricing" }

# The rate after the launch offer, which ends 2026-11-30; the offer is half.
# Implicit caching only.
[[model]]
label = "gemini-large"
provider = "google"
model = "gemini-4-argon"
price = { input = 4.0, cached_input = 0.2, output = 20.0, read_on = 2026-10-21, source = "https://ai.google.dev/gemini-api/docs/pricing" }

# The rate after the launch offer, which ends 2026-12-31; the offer is half.
[[model]]
label = "gemini-mid"
provider = "google"
model = "gemini-3.8-flash"
price = { input = 1.5, cached_input = 0.15, output = 7.5, read_on = 2026-10-21, source = "https://ai.google.dev/gemini-api/docs/pricing" }
