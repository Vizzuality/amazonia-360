services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amazonia360_docs
    ports:
      - "5433:5432"
    volumes:
      - docs-postgres:/var/lib/postgresql/data
      - ./docker/docs-init.sh:/docker-entrypoint-initdb.d/docs-init.sh:ro
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6343:6333"
    volumes:
      - docs-qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  docs-postgres:
  docs-qdrant:
