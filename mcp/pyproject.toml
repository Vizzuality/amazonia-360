[project]
name = "mcp-server"
version = "0.1.0"
description = "Amazonia 360 MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "shapely>=2.1",
    "pyproj>=3.8",
]

[project.scripts]
amazonia360-mcp = "mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pyright>=1.1.414",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B", "N", "I", "UP", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls the published ArcGIS services; run with -m live"]
