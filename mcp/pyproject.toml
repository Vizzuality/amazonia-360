[project]
name = "mcp-server"
version = "0.1.0"
description = "Amazonia 360 MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "shapely>=2.1",
    "pyproj>=3.8",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "uvicorn>=0.35",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.12",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "pyjwt[crypto]>=2.10",
    "qdrant-client>=1.20",
    "fastembed>=0.9.1",
    "openai>=2",
]

[project.optional-dependencies]
ingest = [
    "docling>=2.142.1",
    "rapidocr>=3.10",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "fastapi>=0.162",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pillow",
]

[project.scripts]
amazonia360-mcp = "mcp_server.__main__:main"
amazonia360-mcp-catalogue = "mcp_server.catalogue.cli:main"
amazonia360-mcp-measure = "mcp_server.measurement.model_run.cli:main"
amazonia360-mcp-timing = "mcp_server.measurement.timing_run:main"
amazonia360-mcp-http = "mcp_server.__main__:http"
amazonia360-mcp-chat = "mcp_server.__main__:chat"
amazonia360-mcp-db = "mcp_server.db.migrate:main"
amazonia360-docs = "mcp_server.documents.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pyright>=1.1.414",
    "ruff>=0.16",
    {include-group = "measure"},
]
measure = []

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B", "N", "I", "UP", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not slow'"
markers = [
    "live: calls the published ArcGIS services or OpenAI; run with -m live",
    "slow: needs real models or documents (deselected by default)",
    "db: needs MCP_TEST_DATABASE_URL, a PostgreSQL database whose name ends in _test",
]
pythonpath = ["."]
